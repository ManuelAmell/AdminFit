services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: adminfit
      POSTGRES_PASSWORD: adminfit
      POSTGRES_DB: adminfit
    ports:
      - "5432:5432"
    volumes:
      - adminfit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adminfit -d adminfit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  adminfit_postgres_data:
